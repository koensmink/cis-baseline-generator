<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="570" viewBox="0 0 1520 570" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0f172a"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#34d399"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/></linearGradient><linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#fb923c"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/></marker><style>.title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#7dd3fc}.sub{font:15px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.h{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#fff}.t{font:14px 'Segoe UI',Arial,sans-serif;fill:#e2e8f0}.s{font:13px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}.card{fill:#111827;stroke:#334155;stroke-width:2}.line{fill:none;stroke:#7dd3fc;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#fbbf24;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}</style></defs><rect width="1520" height="570" fill="url(#bg)"/><text x="45" y="52" class="title">Mandatory Decision Flow</text><text x="45" y="78" class="sub">Deterministic preselection with explicit evidence, applicability, confidence, and human authority</text><rect x="50" y="120" width="130" height="72" rx="16" fill="url(#blue)"/><text x="68" y="152" class="h">ControlRecord</text><path class="line" d="M180 156H198"/><rect x="200" y="120" width="130" height="72" rx="16" fill="url(#purple)"/><text x="218" y="148" class="s">Formal</text><text x="218" y="168" class="s">eligibility</text><path class="line" d="M330 156H348"/><rect x="350" y="120" width="130" height="72" rx="16" fill="url(#purple)"/><text x="368" y="148" class="s">Mandatory</text><text x="368" y="168" class="s">criteria</text><path class="line" d="M480 156H498"/><rect x="500" y="120" width="130" height="72" rx="16" fill="url(#purple)"/><text x="518" y="142" class="s">Related-control</text><text x="518" y="162" class="s">comparison</text><path class="line" d="M630 156H648"/><rect x="650" y="120" width="130" height="72" rx="16" fill="url(#purple)"/><text x="668" y="148" class="s">Boundary-set</text><text x="668" y="168" class="s">role</text><path class="line" d="M780 156H798"/><rect x="800" y="120" width="130" height="72" rx="16" fill="url(#purple)"/><text x="818" y="140" class="s">Security Knowledge</text><text x="818" y="160" class="s">resolution</text><path class="line" d="M930 156H948"/><rect x="950" y="120" width="130" height="72" rx="16" fill="url(#green)"/><text x="968" y="148" class="s">Attack-path</text><text x="968" y="168" class="s">evidence</text><path class="line" d="M1080 156H1098"/><rect x="1100" y="120" width="130" height="72" rx="16" fill="url(#green)"/><text x="1118" y="138" class="s">Applicability /</text><text x="1118" y="157" class="s">confidence</text><text x="1118" y="176" class="s">validation</text><path class="line" d="M1230 156H1248"/><rect x="1250" y="120" width="130" height="72" rx="16" fill="url(#green)"/><text x="1268" y="152" class="h">Decision</text><rect x="60" y="255" width="820" height="235" rx="20" class="card"/><text x="85" y="290" class="h">Candidate Mandatory requires all applicable conditions</text><circle cx="105" cy="330" r="7" fill="#34d399"/><text x="125" y="335" class="t">Primary boundary, complementary core, or prerequisite</text><circle cx="495" cy="330" r="7" fill="#34d399"/><text x="515" y="335" class="t">Concrete attack path</text><circle cx="105" cy="385" r="7" fill="#34d399"/><text x="125" y="390" class="t">Non-compensability</text><circle cx="495" cy="385" r="7" fill="#34d399"/><text x="515" y="390" class="t">High confidence</text><circle cx="105" cy="440" r="7" fill="#34d399"/><text x="125" y="445" class="t">Sufficient attributable source evidence</text><circle cx="495" cy="440" r="7" fill="#34d399"/><text x="515" y="445" class="t">Resolved applicability</text><path class="line" d="M1250 192V245"/><rect x="930" y="245" width="180" height="95" rx="15" fill="url(#green)"/><text x="948" y="275" class="s">Candidate Mandatory</text><text x="948" y="304" class="s">Human review required</text><rect x="1130" y="245" width="180" height="95" rx="15" fill="url(#orange)"/><text x="1148" y="280" class="h">Review Required</text><text x="1148" y="307" class="t">Uncertainty remains</text><rect x="1330" y="245" width="150" height="95" rx="15" fill="url(#blue)"/><text x="1348" y="275" class="s">Regular Control</text><text x="1348" y="307" class="t">No candidacy</text><rect x="980" y="420" width="400" height="100" rx="18" class="card" stroke="#fbbf24"/><text x="1010" y="457" class="h">Definitive Mandatory</text><text x="1010" y="490" class="t">Human approval only — never emitted automatically</text><path class="dash" d="M1020 340V420"/></svg>
