[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cis-pdf2csv"
version = "1.0.1"
description = "Deterministic CIS benchmark parsing, security knowledge analysis, and Windows Intune mapping"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Koen Smink" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "pymupdf==1.24.9",
  "pydantic==2.8.2",
  "rich==13.7.1",
  "openai>=1.30.0",
]

[project.scripts]
cis-pdf2csv = "cis_pdf2csv.cli:main"
cis-intune-map = "cis_pdf2csv.intune_mapper.cli:main"
cis-mandatory-analyze = "cis_pdf2csv.mandatory.cli:main"
